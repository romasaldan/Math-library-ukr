<html>

        <meta charset="utf-8">

		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

	<body>
        <form id="getData">
            <div class='tasc'>
				Ввести кількість випробувань<input type='number' name="dimension"><div class="clear"></div>
				Ввести імовірність успіху<input type='text' name="probability"><div class="clear"></div>
				Тип розподілу 
				<select name="typeOfDistribution">
					<option value='1'>Кількість випробувань для першого успішного випробування</option>
					<option value="0">Кількість неуспіхів до першого успішного випробування</option>
				</select>
				<div class="clear"></div>
				Ввести назву випробування<div class="clear"></div>
				<input type="text" name="nameOfDistribution" placeholder="назва випробування" class="langForm"><div class="clear"></div>
				<!--				<div id="table"></div>-->
				<div id="listOfTasc">
					<label><input type="checkbox" name='discrete' checked>Таблиця дискретного розподілу</label><div class="clear"></div>
					<label><input type="checkbox" name="numberChar" checked>Обчислити числові характеристики</label><div class="clear"></div>
<!--
					<label>Ввести рівень значимості<input type="text" name="levelConfidence"></label><div class="clear"></div>
					<label><input type="checkbox" name="trustAverageKD">Обчислити довірчий інтервал для матсподівання при відомій дисперсії<input type="text" name='deviation'></label><div class="clear"></div>
					<label><input type="checkbox" name="trustAverageUKD">Обчислити довірчий інтервал для матсподівання при невідомому СКВ </label><div class="clear"></div>
					<label><input type="checkbox" name="trustDisp">Обчислити довірчий інтервал для дисперсії і СКВ</label><div class="clear"></div>
-->
					<label><input type="checkbox" name="empireFunction">Функція розподілу</label><div class="clear"></div>		
					<label><input type="checkbox" name="grafEmpireFunction">Графік функції розподілу</label><div class="clear"></div>		
<!--					<label><input type="checkbox" name="grafRelativePolygon">Розподіл відносних частот</label><div class="clear"></div>		-->
					<label><input type="checkbox" name='grafPolygon'>Розподіл частот</label><div class="clear"></div>
					<label><input type="checkbox" name='probInterval'>Перевірити, чи функція належить проміжку 
						<select name='leftInclude'>
							<option value="[">[</option>
							<option value="(">(</option>
						</select>
						<input type="text" class="smallForm" name="leftLimit">;
						<input type="text" class="smallForm" name="rightLimit">
						<select name='rightInclude'>
							<option value="]">]</option>
							<option value=")">)</option>
						</select>
					</label><div class="clear"></div>
					
<!--					<label><input type="checkbox" name="toIntervalDistribution">Перейти до інтервального розподілу з </label><input type="number" name="numberInterval"> інтервалів<div class="clear"></div>-->
<!--					<label><input type="checkbox" name="histogramma">Побудувати гістограму частот</label><div class="clear"></div>-->
					
				</div>
            </div>
			
        </form>
        <input type="button" value="розв'язати задачі" onclick="processData()">
		<div id="solvers"></div>		
		
	
		<script src="limited.js"></script>
