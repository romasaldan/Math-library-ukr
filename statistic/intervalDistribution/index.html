<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="../trustIntervals/style.css">
        <link rel="stylesheet" href="style.css">
        <script src="../../libraryMathDetails/statisticFunctions.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
		<script src="../../libraryMathDetails/statisticLibrary.js"></script>
		<script src="https://cdn.plot.ly/plotly-latest.min.js"></script> <!-- for graf -->		
		<script src="../../libraryMathDetails/universal.js"></script>
		<script src='../trustIntervals/js.js'></script>
    </head>
    <body>
        <form id="getData">
            <div class='tasc'>
				Ввести розмірність інтервального розподілу<input type='number' name="dimension"><div class="clear"></div>
				<div id="table"></div>

				<input type="button" value="Сформвати таблицю і задачі" onclick="createTable()">
				<div id="listOfTasc" class="none" >
					<p>Для інтервального розподілу</p><div class="clear"></div>
					<label><input type="checkbox" name='moda'>Обчислити моду інтервального розподілу</label><div class="clear"></div>
					<label><input type="checkbox" name='mediana'>Обчислити медіану інтервального розподілу</label><div class="clear"></div>
					<label><input type="checkbox" name='histoFReq'> Намалювати гістограму частот інтервального розподілу</label><div class="clear"></div>
					<label><input type="checkbox" name='histoRelativeFReq'> Намалювати гістограму відносних частот інтервального розподілу</label><div class="clear"></div>		
					<p>Для статистичного розподілу</p><div class="clear"></div>					
					<label><input type="checkbox" name='statisticDistribution'>Записати статистичний розподіл</label><div class="clear"></div><label><input type="checkbox" name='comparative'>Сформувати розподіл відносних частот</label><div class="clear"></div>
					<label><input type="checkbox" name="numberChar">Обчислити числові характеристики</label><div class="clear"></div>
					<label>Ввести рівень значимості<input type="text" name="levelConfidence"></label><div class="clear"></div>
					<label><input type="checkbox" name="trustAverageKD">Обчислити довірчий інтервал для матсподівання при відомій дисперсії<input type="text" name='deviation'></label><div class="clear"></div>
					<label><input type="checkbox" name="trustAverageUKD">Обчислити довірчий інтервал для матсподівання при невідомому СКВ </label><div class="clear"></div>
					<label><input type="checkbox" name="trustDisp">Обчислити довірчий інтервал для дисперсії і СКВ</label><div class="clear"></div>
					<label><input type="checkbox" name="empireFunction">Емпірична функція розподілу</label><div class="clear"></div>		
					<label><input type="checkbox" name="grafEmpireFunction">Графік емпіричної функції розподілу</label><div class="clear"></div>		
					<label><input type="checkbox" name="grafRelativePolygon">Розподіл відносних частот</label><div class="clear"></div>		
					<label><input type="checkbox" name='grafPolygon'>Розподіл частот</label><div class="clear"></div>
<!--					<label><input type="checkbox" name="toIntervalDistribution">Перейти до інтервального розподілу з </label><input type="number" name="numberInterval"> інтервалів<div class="clear"></div>-->
					<label><input type="checkbox" name="histogramma">Побудувати гістограму частот</label><div class="clear"></div>	
				</div>				
            </div>
			
		</form>
        <input type="button" value="розв'язати задачі" onclick="processingData()">
		<div id="solvers">
        
        </div>
		<script src="js.js"></script>
    </body>
</html>
